name: CI

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22

            - name: Install
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npm run typecheck

            # build ends with verifyLib: artifact layout assertions, then publint and attw
            - name: Build
              run: npm run build

            # compares against bundle-check/baseline/sizes.json and fails on regressions,
            # so a change that widens sideEffects or drags the Builder into the init path
            # is caught here rather than at publish time
            - name: Tree-shaking and bundle-size gate
              run: npm run bundleCheck

    # Everything that needs a real browser. The charts are WebAssembly and WebGL, so a browser is
    # the only place they run.
    #
    # Runs inside the official Playwright image, pinned to the @playwright/test version, so the
    # browser, fonts and system libraries are fixed. This job is the only place the visual
    # baselines are recorded and judged: screenshots differ slightly between machines, so a
    # developer's machine never writes them. When the visual test fails, the job re-records the
    # screenshots and uploads them; if the change is intended, commit them into
    # tests/__screenshots__/linux/.
    browser-tests:
        runs-on: ubuntu-latest
        container:
            image: mcr.microsoft.com/playwright:v1.63.0-noble
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22

            # the chart-group demo compiles the library from src/, so nothing has to be built first
            - name: Install
              run: |
                  npm ci
                  npm --prefix demos/features/chart-group ci

            # every story is rendered and fails the run if it throws
            - name: Story smoke tests
              run: npm run test:stories:ci

            # every story against its committed baseline, and the chart-group demo's two 2D charts and
            # 3D chart behind the memory-debug wrapper: nothing may be left undeleted or held in
            # memory after repeated mount/unmount
            - name: Visual and memory leak tests
              run: npm run test:e2e

            - name: Re-record the visual baselines
              if: failure()
              run: npm run update-snapshots

            - if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: visual-baselines-linux
                  path: tests/__screenshots__/linux/
                  retention-days: 7

            - if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7

    # Every demo is its own npm project, so nothing above compiles them. Four of the six failed to
    # build during the 2.0 work - a removed Builder namespace, two demos left on scichart 3.x, and
    # a dev script that could not resolve its own dependency - and all four were found by hand.
    # Building each one catches that whole class.
    demos:
        runs-on: ubuntu-latest
        strategy:
            # one broken demo should not hide the state of the others
            fail-fast: false
            matrix:
                include:
                    - demo: demos/features/chart-group
                      build: npm run build
                    - demo: demos/features/legend
                      build: npm run build
                    - demo: demos/react16
                      build: npm run build
                    - demo: demos/react18/basic
                      build: npm run build
                    - demo: demos/scichart-react-next
                      build: npm run build
                    # electron-forge exposes no compile-only command, so packaging is the build.
                    # It downloads an Electron binary, which is why this leg is the slow one.
                    - demo: demos/electron
                      build: npm run package
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            # the root install and build are both prerequisites: the feature demos and react16
            # resolve scichart from the root node_modules, and the rest consume lib/ as a file:
            # dependency, so it has to exist before their install runs
            - name: Install and build the library
              run: |
                  npm ci
                  npm run build

            - name: Install ${{ matrix.demo }}
              working-directory: ${{ matrix.demo }}
              run: npm ci

            - name: Build ${{ matrix.demo }}
              working-directory: ${{ matrix.demo }}
              run: ${{ matrix.build }}
